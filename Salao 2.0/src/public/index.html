<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salão de Beleza</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>💇 Salão de Beleza</h1>
    <!-- Botões para alternar entre as abas -->
    <nav>
      <button onclick="mostrarAba('clientes')">Clientes</button>
      <button onclick="mostrarAba('agendamentos')">Agendamentos</button>
    </nav>
  </header>

  <main>

    <!-- ========== ABA DE CLIENTES ========== -->
    <section id="aba-clientes">
      <h2>Cadastro de Clientes</h2>

      <!-- Formulário para cadastrar ou editar cliente -->
      <form id="formCliente">
        <input type="hidden" id="clienteId" /> <!-- guarda o id ao editar -->
        <input type="text" id="clienteNome" placeholder="Nome completo" required />
        <input type="text" id="clienteTelefone" placeholder="Telefone" required />
        <input type="email" id="clienteEmail" placeholder="Email (opcional)" />
        <button type="submit">Salvar Cliente</button>
        <button type="button" onclick="cancelarEdicaoCliente()">Cancelar</button>
      </form>

      <!-- Lista de clientes cadastrados -->
      <h3>Clientes Cadastrados</h3>
      <table id="tabelaClientes">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ========== ABA DE AGENDAMENTOS ========== -->
    <section id="aba-agendamentos" style="display:none">
      <h2>Agendamentos</h2>

      <!-- Formulário para criar ou editar agendamento -->
      <form id="formAgendamento">
        <input type="hidden" id="agendamentoId" />
        <select id="agendamentoCliente" required>
          <option value="">Selecione o cliente</option>
        </select>
        <select id="agendamentoServico" required>
          <option value="">Selecione o serviço</option>
          <option value="Escova">Escova</option>
          <option value="Tranças">Tranças</option>
          <option value="Manicure">Manicure</option>
        </select>
        <input type="date" id="agendamentoData" required />
        <input type="time" id="agendamentoHora" required />
        <button type="submit">Salvar Agendamento</button>
        <button type="button" onclick="cancelarEdicaoAgendamento()">Cancelar</button>
      </form>

      <!-- Lista de agendamentos -->
      <h3>Agendamentos Marcados</h3>
      <table id="tabelaAgendamentos">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Serviço</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
